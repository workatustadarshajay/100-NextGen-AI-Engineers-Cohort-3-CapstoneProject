<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1c35">
    <title>{% block title %}Neuron Clinical Ops{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind = {
            config: {
                theme: {
                    extend: {
                        colors: {
                            ink: "#0b1c35",
                            signal: "#087e88",
                            coral: "#dc4f70",
                            amber: "#e8ac3d"
                        }
                    }
                }
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="min-h-screen">
        <aside class="shell-sidebar fixed inset-y-0 left-0 z-30 hidden w-[268px] shrink-0 flex-col overflow-hidden px-5 py-6 lg:flex">
            <a href="/documents" class="flex items-center gap-3 px-2" aria-label="Neuron workspace home">
                <span class="brand-mark flex h-10 w-10 items-center justify-center rounded-xl text-sm font-bold text-ink">NR</span>
                <span>
                    <span class="block font-display text-base font-bold tracking-wide text-white">NEURON</span>
                    <span class="block text-[10px] font-semibold uppercase tracking-[0.18em] text-cyan-100/60">Clinical ops</span>
                </span>
            </a>

            <div class="mt-12 px-2 text-[10px] font-bold uppercase tracking-[0.18em] text-cyan-100/40">Workspace</div>
            <nav class="mt-3 space-y-1" aria-label="Primary navigation">
                <a href="/documents" class="nav-item {% if active_page == 'documents' %}is-active{% endif %}">
                    <i data-lucide="layout-dashboard" class="h-4 w-4"></i>
                    <span class="text-sm font-semibold">Document inbox</span>
                </a>
                <a href="/upload" class="nav-item {% if active_page == 'upload' %}is-active{% endif %}">
                    <i data-lucide="file-up" class="h-4 w-4"></i>
                    <span class="text-sm font-semibold">Upload PDF</span>
                </a>
            </nav>

            <div class="mt-auto rounded-2xl border border-white/10 bg-white/[0.08] p-4">
                <div class="flex items-center gap-2 text-xs font-semibold text-white">
                    <span class="h-2 w-2 rounded-full bg-emerald-300 shadow-[0_0_0_4px_rgba(110,231,183,0.12)]"></span>
                    Workflow online
                </div>
                <p class="mt-2 text-xs leading-5 text-cyan-50/55">Three-stage review flow ready for intake.</p>
            </div>
        </aside>

        <main class="min-w-0 lg:ml-[268px] lg:h-screen lg:overscroll-contain lg:overflow-y-auto">
            <header class="sticky top-0 z-20 border-b border-slate-200/80 bg-white/80 backdrop-blur-xl">
                <div class="mx-auto flex min-h-[72px] max-w-[1480px] items-center justify-between gap-4 px-4 sm:px-8 xl:px-12">
                    <div class="flex items-center gap-4">
                        <a href="/documents" class="flex items-center gap-2 lg:hidden" aria-label="Neuron workspace home">
                            <span class="brand-mark flex h-9 w-9 items-center justify-center rounded-lg text-xs font-bold text-ink">NR</span>
                            <span class="font-display text-sm font-bold tracking-wide text-ink">NEURON</span>
                        </a>
                        <nav class="flex items-center gap-1 lg:hidden" aria-label="Mobile navigation">
                            <a href="/documents" class="rounded-lg px-2.5 py-2 text-xs font-semibold {% if active_page == 'documents' %}bg-slate-100 text-ink{% else %}text-slate-500{% endif %}">Inbox</a>
                            <a href="/upload" class="rounded-lg px-2.5 py-2 text-xs font-semibold {% if active_page == 'upload' %}bg-slate-100 text-ink{% else %}text-slate-500{% endif %}">Upload</a>
                        </nav>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="hidden items-center gap-2 text-xs font-semibold text-slate-500 sm:flex">
                            <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
                            Connected workspace
                        </span>
                        <span class="flex h-9 w-9 items-center justify-center rounded-full bg-[#e7f1f2] text-xs font-bold text-[#087e88]">JS</span>
                    </div>
                </div>
            </header>

            <div class="mx-auto max-w-[1480px] px-4 pb-8 sm:px-8 xl:px-12">
                {% block content %}{% endblock %}
                <footer class="mt-10 flex flex-col gap-2 border-t border-slate-200/70 py-5 text-[11px] font-medium text-slate-400 sm:flex-row sm:items-center sm:justify-between">
                    <span>Neuron Clinical Ops</span>
                    <span>Document review workspace</span>
                </footer>
            </div>
        </main>
    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="{{ url_for('static', path='js/app.js') }}?v=5"></script>
</body>
</html>
